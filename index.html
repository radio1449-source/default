<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>우주 수비대</title>
<style>
  html,body{margin:0;height:100%;background:#05060f;color:#fff;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}
  canvas{display:block;margin:0 auto;background:#0a0c1f;max-width:100%;max-height:100%}
</style>
</head>
<body>
<canvas id="c" width="480" height="720"></canvas>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height;

let state, keys = {}, pointerX = null, best = +(localStorage.getItem('best') || 0);

function reset() {
  state = {
    mode: 'title', score: 0, lives: 3, level: 1, t: 0,
    player: { x: W / 2, y: H - 70, cd: 0, inv: 0 },
    bullets: [], enemies: [], shots: [], particles: [], items: [],
    stars: Array.from({ length: 60 }, () => ({ x: Math.random() * W, y: Math.random() * H, s: 0.5 + Math.random() * 2 })),
    spawn: 0, power: 0
  };
}
reset();

addEventListener('keydown', e => {
  keys[e.key] = true;
  if ((e.key === ' ' || e.key === 'Enter') && state.mode !== 'play') start();
  if (e.key === ' ') e.preventDefault();
});
addEventListener('keyup', e => keys[e.key] = false);
function px(e) { const r = cv.getBoundingClientRect(); return (e.clientX - r.left) * W / r.width; }
cv.addEventListener('pointerdown', e => { pointerX = px(e); if (state.mode !== 'play') start(); });
cv.addEventListener('pointermove', e => { if (e.buttons || e.pointerType === 'touch') pointerX = px(e); });
cv.addEventListener('pointerup', () => pointerX = null);

function start() { const b = state.stars; reset(); state.stars = b; state.mode = 'play'; }

function boom(x, y, color, n = 14) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * 6.283, v = 1 + Math.random() * 4;
    state.particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 30 + Math.random() * 20, color });
  }
}

function spawnEnemy() {
  const lv = state.level, r = Math.random();
  const type = r < 0.15 + lv * 0.02 ? 'tank' : r < 0.45 ? 'zig' : 'basic';
  state.enemies.push({
    type, x: 30 + Math.random() * (W - 60), y: -30, ph: Math.random() * 6,
    hp: type === 'tank' ? 4 : 1, vy: (type === 'tank' ? 0.8 : 1.3) + lv * 0.15,
    cd: 60 + Math.random() * 90
  });
}

function update() {
  const s = state; s.t++;
  s.stars.forEach(st => { st.y += st.s; if (st.y > H) { st.y = 0; st.x = Math.random() * W; } });
  s.particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; });
  s.particles = s.particles.filter(p => p.life > 0);
  if (s.mode !== 'play') return;

  const p = s.player, sp = 5;
  if (keys.ArrowLeft || keys.a) p.x -= sp;
  if (keys.ArrowRight || keys.d) p.x += sp;
  if (keys.ArrowUp || keys.w) p.y -= sp;
  if (keys.ArrowDown || keys.s) p.y += sp;
  if (pointerX !== null) p.x += Math.max(-sp * 1.6, Math.min(sp * 1.6, pointerX - p.x));
  p.x = Math.max(20, Math.min(W - 20, p.x));
  p.y = Math.max(H / 2, Math.min(H - 30, p.y));
  if (p.inv > 0) p.inv--;

  // auto fire
  if (--p.cd <= 0) {
    p.cd = 12;
    const n = s.power > 0 ? 3 : 1;
    for (let i = 0; i < n; i++) s.bullets.push({ x: p.x + (i - (n - 1) / 2) * 12, y: p.y - 18, vx: (i - (n - 1) / 2) * 1.2 });
  }
  if (s.power > 0) s.power--;
  s.bullets.forEach(b => { b.y -= 9; b.x += b.vx; });
  s.bullets = s.bullets.filter(b => b.y > -10);

  // spawn
  s.level = 1 + Math.floor(s.score / 500);
  if (--s.spawn <= 0) { spawnEnemy(); s.spawn = Math.max(18, 55 - s.level * 4); }

  for (const e of s.enemies) {
    e.y += e.vy;
    if (e.type === 'zig') e.x += Math.sin(s.t / 14 + e.ph) * 2.5;
    e.x = Math.max(15, Math.min(W - 15, e.x));
    if (--e.cd <= 0 && e.y > 0 && e.y < H - 200) {
      e.cd = Math.max(50, 140 - s.level * 8);
      const dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy) || 1;
      s.shots.push({ x: e.x, y: e.y + 12, vx: dx / d * 3, vy: dy / d * 3 });
    }
    for (const b of s.bullets) {
      if (!b.dead && Math.abs(b.x - e.x) < 18 && Math.abs(b.y - e.y) < 18) { b.dead = true; e.hp--; boom(b.x, b.y, '#ff0', 3); }
    }
    if (e.hp <= 0 && !e.dead) {
      e.dead = true; s.score += e.type === 'tank' ? 50 : 10;
      boom(e.x, e.y, e.type === 'tank' ? '#f80' : '#f55');
      if (Math.random() < 0.1) s.items.push({ x: e.x, y: e.y });
    }
    if (!e.dead && p.inv <= 0 && Math.abs(p.x - e.x) < 22 && Math.abs(p.y - e.y) < 22) { e.dead = true; hit(); }
  }
  s.bullets = s.bullets.filter(b => !b.dead);
  s.enemies = s.enemies.filter(e => !e.dead && e.y < H + 30);

  s.shots.forEach(b => { b.x += b.vx; b.y += b.vy; });
  for (const b of s.shots) if (p.inv <= 0 && Math.hypot(b.x - p.x, b.y - p.y) < 14) { b.dead = true; hit(); }
  s.shots = s.shots.filter(b => !b.dead && b.y < H + 10 && b.y > -10 && b.x > -10 && b.x < W + 10);

  s.items.forEach(i => i.y += 2);
  for (const i of s.items) if (Math.hypot(i.x - p.x, i.y - p.y) < 24) { i.dead = true; s.power = 420; s.score += 20; boom(i.x, i.y, '#0ff', 10); }
  s.items = s.items.filter(i => !i.dead && i.y < H + 20);
}

function hit() {
  const s = state, p = s.player;
  boom(p.x, p.y, '#6cf', 24); s.lives--; p.inv = 120;
  if (s.lives <= 0) {
    s.mode = 'over';
    if (s.score > best) { best = s.score; try { localStorage.setItem('best', best); } catch (e) {} }
  }
}

function draw() {
  const s = state;
  ctx.fillStyle = '#0a0c1f'; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = '#fff';
  s.stars.forEach(st => { ctx.globalAlpha = st.s / 3; ctx.fillRect(st.x, st.y, st.s, st.s); });
  ctx.globalAlpha = 1;

  s.items.forEach(i => { ctx.fillStyle = '#0ff'; ctx.beginPath(); ctx.arc(i.x, i.y, 9, 0, 7); ctx.fill(); ctx.fillStyle = '#000'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('P', i.x, i.y + 4); });
  s.bullets.forEach(b => { ctx.fillStyle = '#ff6'; ctx.fillRect(b.x - 2, b.y - 8, 4, 14); });
  s.shots.forEach(b => { ctx.fillStyle = '#f66'; ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, 7); ctx.fill(); });

  s.enemies.forEach(e => {
    ctx.fillStyle = e.type === 'tank' ? '#e83' : e.type === 'zig' ? '#c5f' : '#e44';
    const r = e.type === 'tank' ? 18 : 13;
    ctx.beginPath(); ctx.moveTo(e.x - r, e.y - r * .7); ctx.lineTo(e.x + r, e.y - r * .7); ctx.lineTo(e.x, e.y + r); ctx.closePath(); ctx.fill();
  });

  const p = s.player;
  if (s.mode !== 'over' && (p.inv <= 0 || s.t % 8 < 4)) {
    ctx.fillStyle = '#6cf';
    ctx.beginPath(); ctx.moveTo(p.x, p.y - 20); ctx.lineTo(p.x + 16, p.y + 16); ctx.lineTo(p.x, p.y + 8); ctx.lineTo(p.x - 16, p.y + 16); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fa4'; ctx.fillRect(p.x - 3, p.y + 10, 6, 6 + (s.t % 6));
  }
  s.particles.forEach(q => { ctx.globalAlpha = q.life / 50; ctx.fillStyle = q.color; ctx.fillRect(q.x, q.y, 3, 3); });
  ctx.globalAlpha = 1;

  ctx.fillStyle = '#fff'; ctx.font = '16px sans-serif'; ctx.textAlign = 'left';
  ctx.fillText('점수 ' + s.score, 12, 24);
  ctx.textAlign = 'center'; ctx.fillText('레벨 ' + s.level, W / 2, 24);
  ctx.textAlign = 'right'; ctx.fillText('♥'.repeat(Math.max(0, s.lives)), W - 12, 24);

  if (s.mode !== 'play') {
    ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = '#fff'; ctx.textAlign = 'center';
    ctx.font = 'bold 40px sans-serif';
    ctx.fillText(s.mode === 'title' ? '우주 수비대' : '게임 오버', W / 2, H / 2 - 40);
    ctx.font = '18px sans-serif';
    if (s.mode === 'over') ctx.fillText('점수 ' + s.score, W / 2, H / 2);
    ctx.fillText('최고 점수 ' + best, W / 2, H / 2 + 28);
    ctx.fillText('스페이스 / 화면 터치로 시작', W / 2, H / 2 + 70);
    ctx.font = '14px sans-serif'; ctx.fillStyle = '#9ab';
    ctx.fillText('방향키·WASD 또는 터치 드래그로 이동 (자동 발사)', W / 2, H / 2 + 100);
  }
}

(function loop() { update(); draw(); requestAnimationFrame(loop); })();
</script>
</body>
</html>
